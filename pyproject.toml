[project]
name = "financial-agent-reliability"
version = "0.3.0"
description = "Offline-first financial model × agent benchmark MVP"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26.0"]

[project.scripts]
bench = "financial_agent_reliability.cli:main"

[dependency-groups]
dev = ["ruff>=0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_agent_reliability"]

[tool.hatch.build.targets.sdist]
include = [
  "src/financial_agent_reliability",
  "configs",
  "tasks",
  "tests",
  "docs",
  "README.md",
  "AGENTS.md",
  "package.json",
  "package-lock.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
